    <style>
        :root {
            --bg: #0e0f12;
            --panel: #2a2b2f;
            --panel-2: #1f2024;
            --text: #e8e8ea;
            --muted: #b7b7bb;
            --line: rgba(255, 255, 255, .08);
            --green: #5dbb46;
            --green-2: #3ea735;
            --blue: #3b82f6;
            --shadow: 0 18px 55px rgba(0, 0, 0, .55);
            --radius: 14px;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(900px 500px at 50% 20%, rgba(255, 255, 255, .06), transparent 65%),
                        linear-gradient(180deg, #0c0d10, var(--bg));
            color: var(--text);
            font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            overflow: hidden;
        }

        .app {
            width: min(500px, 94vw);
            height: 94svh;
            padding: 20px 16px 16px;
            background: rgba(255, 255, 255, .03);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px 4px;
            margin: 10px 0;
        }

        .scroll-area::-webkit-scrollbar { width: 3px; }
        .scroll-area::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
        }

        .brand-label {
            font-size: 10px;
            font-weight: 900;
            color: var(--green);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .03));
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 18px;
        }

        .qmeta {
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .qtext {
            font-size: 17px;
            margin: 0 0 20px;
            font-weight: 600;
            line-height: 1.5;
            text-align: center;
        }

        .options {
            display: grid;
            gap: 10px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .opt {
            width: 100%;
            text-align: left;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .05);
            color: var(--text);
            cursor: pointer;
            transition: all .15s ease;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .opt:hover:not(:disabled) { background: rgba(255, 255, 255, .08); }
        .opt:active:not(:disabled) { transform: scale(0.98); }

        .tag {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--line);
            color: var(--muted);
            font-weight: 800;
            flex: 0 0 28px;
        }

        .opt.correct {
            background: rgba(93, 187, 70, 0.18) !important;
            border-color: rgba(93, 187, 70, 0.5) !important;
        }
        .opt.correct .tag {
            background: var(--green);
            color: #000;
        }

        .opt.wrong {
            background: rgba(255, 80, 80, .18) !important;
            border-color: rgba(255, 80, 80, .5) !important;
        }
        .opt.wrong .tag { background: #ff5050; color: #fff; }

        .footer {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
        }

        .btn {
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .05);
            color: var(--text);
            cursor: pointer;
            flex: 1;
            font-weight: 800;
            font-size: 13px;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn.primary {
            background: linear-gradient(180deg, var(--green), var(--green-2));
            color: #0b120a;
            border: none;
        }

        .btn:disabled { opacity: 0.15; }

        .welcome-screen { text-align: center; }

        .mode-btn {
            display: block;
            width: 100%;
            padding: 22px;
            margin-bottom: 14px;
            background: rgba(255,255,255,.04);
            border: 1px solid var(--line);
            border-radius: 18px;
            color: var(--text);
            cursor: pointer;
            transition: 0.2s;
        }

        .mode-btn:active { transform: scale(0.97); background: rgba(255,255,255,.08); }

        .prajwal-jogi {
            margin-top: 30px;
            font-size: 11px;
            color: var(--green);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: rgba(93, 187, 70, 0.1);
            padding: 8px 16px;
            border-radius: 100px;
            display: inline-block;
        }

        .hidden { display: none !important; }

        .mjx-container {
            max-width: 100% !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            color: inherit !important;
        }
    </style>
</head>

            { q: "Which matrix is stochastic?", o: ["Rectangular", "$(\\begin{matrix}1/4&3/4\\\\ 0&1\\end{matrix})$", "$(\\begin{matrix}1/2&1/3\\\\ 0&1/2\\end{matrix})$", "Negative values"], a: 1 },
            { q: "Markov chain $P[X_{0}=0]=1/4, P[X_{0}=1]=1/4, P[X_{0}=2]=1/2$. Find $P[X_{1}=1]$ given $P=\\begin{pmatrix}1/2&1/3&1/6\\\\ 0&1/3&2/3\\\\ 1/2&0&1/2\\end{pmatrix}$", o: ["1/3", "1/4", "1/5", "1/6"], a: 3 },
            { q: "A Markov Chain is irreducible if transition matrix is", o: ["Regular stochastic", "Stochastic", "Not regular", "Not stochastic"], a: 0 },
            { q: "Given $P=\\begin{pmatrix}0&1/4&3/4\\\\ 0&1&0\\\\ 1/2&0&1/2\\end{pmatrix}$, which states are absorbing?", o: ["State 2", "States 2 and 3", "State 1", "States 1 and 2"], a: 0 },
            { q: "If $P=\\begin{pmatrix}0&1\\\\ 1&0\\end{pmatrix}$, which states are recurrent?", o: ["State 1", "State 2", "Both 1 and 2", "No states"], a: 2 },
            { q: "If $P=\\begin{pmatrix}0&1\\\\ 1&0\\end{pmatrix}$, which states are transient?", o: ["State 1", "State 2", "Both 1 and 2", "No states"], a: 3 },
            { q: "If $P=\\begin{pmatrix}1&0\\\\ 0&1\\end{pmatrix}$, which states are aperiodic?", o: ["Both 1 and 2", "State 1", "State 2", "No states"], a: 0 },
            { q: "If $P=\\begin{pmatrix}1&0&0\\\\ 1/2&1/2&0\\\\ 1/4&1/4&1/2\\end{pmatrix}$ then $P(X_{2}=1|X_{1}=2)=$", o: ["1", "1/2", "1/4", "0"], a: 2 },
            { q: "If $P=\\begin{pmatrix}1&0&0\\\\ 1/2&1/2&0\\\\ 1/4&1/4&1/2\\end{pmatrix}$ then $P(X_{3}=2|X_{1}=2, X_{2}=1)=$", o: ["1", "1/2", "1/4", "0"], a: 3 }
        ];

        let currentIdx = 0;
        let quizMode = 'withoutAnswer';
        let userAnswers = new Array(quizData.length).fill(null);

        function initQuiz(mode) {
            quizMode = mode;
            currentIdx = 0;
            userAnswers = new Array(quizData.length).fill(null);
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-ui').classList.remove('hidden');
            
            // Auto-fill answers if in "With Answer" mode
            if (mode === 'withAnswer') {
                quizData.forEach((item, i) => userAnswers[i] = item.a);
            }
            
            render();
        }

        function render() {
            const q = quizData[currentIdx];
            const displayNum = currentIdx >= 45 ? currentIdx + 2 : currentIdx + 1; // Skip 46 handling

            document.getElementById('progress-text').textContent = `${currentIdx + 1}/${quizData.length}`;
            document.getElementById('q-number').textContent = `Question ${displayNum}/89`;
            document.getElementById('question-text').innerHTML = q.q;

            const list = document.getElementById('options-list');
            list.innerHTML = "";

            q.o.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "opt";
                
                // Mode logic
                if (userAnswers[currentIdx] !== null) {
                    if (quizMode === 'withAnswer') {
                        if (idx === q.a) btn.classList.add('correct');
                    } else {
                        // Exam Mode: Reveal result on selection
                        if (idx === q.a) btn.classList.add('correct');
                        if (userAnswers[currentIdx] === idx && idx !== q.a) btn.classList.add('wrong');
                    }
                    btn.disabled = true;
                }

                btn.innerHTML = `<span class="tag">${String.fromCharCode(97 + idx)}</span><span>${opt}</span>`;
                btn.onclick = () => select(idx);
                list.appendChild(btn);
            });

            document.getElementById('next-btn').textContent = currentIdx === quizData.length - 1 ? "Finish" : "Next";
            
            if (window.MathJax) MathJax.typesetPromise();
        }

        function select(idx) {
            if (quizMode === 'withAnswer') return;
            if (userAnswers[currentIdx] !== null) return;
            
            userAnswers[currentIdx] = idx;
            render();
        }

        function nav(dir) {
            if (dir === -1 && currentIdx === 0) {
                location.reload();
                return;
            }

            if (dir === 1 && currentIdx === quizData.length - 1) {
                showResults();
                return;
            }

            const next = currentIdx + dir;
            if (next >= 0 && next < quizData.length) {
                currentIdx = next;
                render();
                document.querySelector('.scroll-area').scrollTop = 0;
            }
        }

        function showResults() {
            document.getElementById('quiz-ui').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const score = userAnswers.reduce((acc, curr, i) => acc + (curr === quizData[i].a ? 1 : 0), 0);
            const percent = Math.round((score / quizData.length) * 100);
            
            document.getElementById('final-score').textContent = `${percent}%`;
            document.getElementById('result-desc').textContent = `Correct: ${score} | Total: ${quizData.length}`;
        }
    </script>
</body>
</html>
